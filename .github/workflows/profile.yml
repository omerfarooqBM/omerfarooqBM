name: Refresh profile

on:
  schedule:
    - cron: "17 3,15 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "profile.config.json"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  cards:
    name: Stats cards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Generate SVG cards
        run: node scripts/generate.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          if git diff --staged --quiet; then
            echo "Cards are already up to date"
          else
            git commit -m "chore: refresh profile cards"
            git push
          fi

  snake:
    name: Contribution snake
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#6250d6&color_dots=#e1e0d9,#6da7ec,#3987e5,#256abf,#184f95
            dist/snake-dark.svg?palette=github-dark&color_snake=#9085e9&color_dots=#2c2c2a,#184f95,#256abf,#3987e5,#6da7ec

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: refresh contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
